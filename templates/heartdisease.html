<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heart Disease Predictor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='stylesheet.css') }}">
</head>
<body>
  <div class="overlay"></div>

  <nav class="navbar">
    <div class="logo">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
    </div>
    <ul class="nav-links">
      <li><a href="/home">Home</a></li>
      <li><a href="/aboutUs">About Us</a></li>
      <li><a href="/contactUs">Contact Us</a></li>
      <li><a href="/logout">Logout</a></li>
    </ul>
  </nav>

  <div class="welcome-container">
    <span class="welcome-text">WELCOME: {{ username }}</span>
  </div>

  <section class="landing">
    <div class="content">
      <h1>HEART DISEASE PREDICTOR</h1>
      <form id="predictForm" onsubmit="process(); return false;">

        <label>Age:</label>
        <input type="number" name="age" placeholder="Enter Your Age (1–99)" required min="1" max="99">

        <label>Chest Pain (CP):</label>
        <input type="number" name="chestpain" placeholder="Enter Chest Pain Level (1–4)" required min="1" max="4">

        <label>Resting BP (Trestbps):</label>
        <input type="number" name="trestbps" placeholder="Enter Resting BP (90–200)" required min="90" max="200">

        <label>Cholesterol (Chol):</label>
        <input type="number" name="chol" placeholder="Enter Cholesterol Level" required min="100">

        <label>Resting ECG (Restecg):</label>
        <input type="number" name="restecg" placeholder="Enter Restecg Level (1–3)" required min="1" max="3">

        <label>Thalach:</label>
        <input type="number" name="thalch" placeholder="Enter Max Heart Rate" required min="60" max="220">

        <label>Exang:</label>
        <input type="number" name="exang" placeholder="Enter Exang (0 or 1)" required min="0" max="1">

        <label>Fasting Blood Sugar > 120 (Fbs):</label>
        <input type="number" name="fbs" placeholder="Enter FBS (0 or 1)" required min="0" max="1">

        <label>Oldpeak:</label>
        <input type="number" step="0.1" name="oldpeak" placeholder="Enter Oldpeak (0–4)" required min="0" max="4">

        <label>ST Slope:</label>
        <input type="number" name="slope" placeholder="Enter Slope Level (1–3)" required min="1" max="3">

        <label>CA Level:</label>
        <input type="number" name="ca" placeholder="Enter CA Level (0–2)" required min="0" max="2">

        <label>Thal:</label>
        <input type="number" name="thal" placeholder="Enter Thal (1–3)" required min="1" max="3">

        <button type="submit" class="btn" style="background: #ff4c4c;">Predict Heart Disease</button>
      </form>

      <div id="prediction" style="margin-top:20px; font-weight:bold;"></div>
    </div>

    <div class="image-container">
      <img src="{{ url_for('static', filename='heart.png') }}" alt="Heart Image">
    </div>
  </section>

  <!-- JS -->
  <script>
    function form_handler(event) {
      event.preventDefault();
    }

    function process() {
      document.querySelector("#predictForm").addEventListener("submit", form_handler);
      var data = new FormData(document.querySelector('#predictForm'));

      var xhr = new XMLHttpRequest();
      xhr.open("POST", "/heartDiseasePrediction", true);
      document.getElementById("prediction").innerHTML = "Wait! Predicting Result...";

      xhr.onreadystatechange = function() {
        if (xhr.readyState === XMLHttpRequest.DONE) {
          if (xhr.status === 200) {
            const response = xhr.responseText.trim();
            if (response === "1") {
              let text = "<span style='color: blue;'>PLEASE CONSULT WITH DOCTOR</span>";
              
              document.getElementById("prediction").innerHTML =
                "<span style='color: black;'>PREDICTION: POSITIVE!! (Heart Disease)<br></span>" + text;
            } else if (response === "0") {
              document.getElementById("prediction").innerHTML =
                "<span style='color: red;'>PREDICTION: NEGATIVE!!<br></span>NO NEED TO WORRY, YOU ARE HEALTHY.";
            } else {
              document.getElementById("prediction").innerHTML = "Unexpected response or Error: " + response;
            }
          } else {
            document.getElementById("prediction").innerHTML =
              "Error contacting server! (Status: " + xhr.status + ")";
          }
        }
      };
      xhr.send(data);
    }
  </script>
</body>
</html>
